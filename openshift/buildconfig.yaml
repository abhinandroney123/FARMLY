---
# OpenShift ImageStream for Farmly
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: farmly
  labels:
    app: farmly
    app.kubernetes.io/part-of: farmly-app

---
# OpenShift BuildConfig (Builds image inside OpenShift from local files or Git)
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: farmly
  labels:
    app: farmly
    app.kubernetes.io/part-of: farmly-app
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: farmly:latest
